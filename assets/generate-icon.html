<!DOCTYPE html>
<html>
<head>
  <title>BerserkLifts Icon Generator</title>
  <style>
    body { background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
    h1 { color: #FF2D55; }
    canvas { border: 1px solid #333; margin: 20px; }
    button { background: #FF2D55; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 10px; }
    button:hover { background: #e61e4d; }
    p { color: #888; }
  </style>
</head>
<body>
  <h1>BerserkLifts Icon Generator</h1>
  <p>Click download to save the icon as PNG</p>
  <canvas id="icon" width="1024" height="1024"></canvas>
  <div>
    <button onclick="download(1024, 'icon.png')">Download 1024x1024 (App Icon)</button>
    <button onclick="download(512, 'icon-512.png')">Download 512x512</button>
    <button onclick="download(192, 'icon-192.png')">Download 192x192 (PWA)</button>
    <button onclick="download(180, 'apple-touch-icon.png')">Download 180x180 (Apple)</button>
    <button onclick="download(32, 'favicon-32.png')">Download 32x32 (Favicon)</button>
  </div>
  <script>
    const canvas = document.getElementById('icon');
    const ctx = canvas.getContext('2d');
    const s = 1024;

    // Background
    ctx.fillStyle = '#0A0A0A';
    ctx.beginPath();
    ctx.roundRect(0, 0, s, s, 220);
    ctx.fill();

    // Border
    ctx.strokeStyle = 'rgba(255, 45, 85, 0.3)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(20, 20, s-40, s-40, 200);
    ctx.stroke();

    function drawSword(angle) {
      ctx.save();
      ctx.translate(s/2, s/2);
      ctx.rotate(angle);
      
      // Blade
      ctx.fillStyle = '#C0C0C0';
      ctx.beginPath();
      ctx.roundRect(-8, -320, 16, 480, 4);
      ctx.fill();
      
      // Blade highlight
      ctx.fillStyle = 'rgba(224,224,224,0.5)';
      ctx.beginPath();
      ctx.roundRect(-4, -320, 8, 480, 2);
      ctx.fill();
      
      // Guard
      ctx.fillStyle = '#FF2D55';
      ctx.beginPath();
      ctx.roundRect(-40, 140, 80, 12, 4);
      ctx.fill();
      
      // Grip
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.roundRect(-6, 152, 12, 80, 3);
      ctx.fill();
      
      // Pommel
      ctx.fillStyle = '#FF2D55';
      ctx.beginPath();
      ctx.arc(0, 240, 10, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }

    // Draw crossed swords
    drawSword(-Math.PI/4);
    drawSword(Math.PI/4);

    // Center diamond
    ctx.fillStyle = '#FF2D55';
    ctx.beginPath();
    ctx.moveTo(s/2, s/2 - 30);
    ctx.lineTo(s/2 + 30, s/2);
    ctx.lineTo(s/2, s/2 + 30);
    ctx.lineTo(s/2 - 30, s/2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0A0A0A';
    ctx.beginPath();
    ctx.moveTo(s/2, s/2 - 18);
    ctx.lineTo(s/2 + 18, s/2);
    ctx.lineTo(s/2, s/2 + 18);
    ctx.lineTo(s/2 - 18, s/2);
    ctx.closePath();
    ctx.fill();

    function download(size, filename) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = size;
      tempCanvas.height = size;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(canvas, 0, 0, size, size);
      const link = document.createElement('a');
      link.download = filename;
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
