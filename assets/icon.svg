<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="#0A0A0A"/>
  
  <!-- Subtle border -->
  <rect x="20" y="20" width="984" height="984" rx="200" fill="none" stroke="#FF2D55" stroke-width="3" opacity="0.3"/>
  
  <!-- Crossed Swords -->
  <!-- Sword 1 (top-left to bottom-right) -->
  <g transform="translate(512,512) rotate(-45)">
    <!-- Blade -->
    <rect x="-8" y="-320" width="16" height="480" rx="4" fill="#C0C0C0"/>
    <rect x="-4" y="-320" width="8" height="480" rx="2" fill="#E0E0E0" opacity="0.5"/>
    <!-- Guard -->
    <rect x="-40" y="140" width="80" height="12" rx="4" fill="#FF2D55"/>
    <!-- Grip -->
    <rect x="-6" y="152" width="12" height="80" rx="3" fill="#1a1a1a"/>
    <!-- Pommel -->
    <circle cx="0" cy="240" r="10" fill="#FF2D55"/>
  </g>
  
  <!-- Sword 2 (top-right to bottom-left) -->
  <g transform="translate(512,512) rotate(45)">
    <!-- Blade -->
    <rect x="-8" y="-320" width="16" height="480" rx="4" fill="#C0C0C0"/>
    <rect x="-4" y="-320" width="8" height="480" rx="2" fill="#E0E0E0" opacity="0.5"/>
    <!-- Guard -->
    <rect x="-40" y="140" width="80" height="12" rx="4" fill="#FF2D55"/>
    <!-- Grip -->
    <rect x="-6" y="152" width="12" height="80" rx="3" fill="#1a1a1a"/>
    <!-- Pommel -->
    <circle cx="0" cy="240" r="10" fill="#FF2D55"/>
  </g>
  
  <!-- Center diamond -->
  <g transform="translate(512,512)">
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#FF2D55"/>
    <polygon points="0,-18 18,0 0,18 -18,0" fill="#0A0A0A"/>
  </g>
</svg>
